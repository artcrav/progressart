<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Craving ART — workdays</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;--white:#fff;--surface:#f0ede8;--border:#e4e0d8;--border2:#cac6bc;
  --ink:#18160f;--ink2:#5a5648;--ink3:#9a9688;--ink4:#c8c4b8;
  --red:#c42800;--red-bg:#fff2ee;--red-bd:#f0c0b0;
  --r:12px;--r-sm:8px;--shadow:0 2px 16px rgba(0,0,0,.07);
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;min-height:100vh}
.view{display:none}.view.active{display:block}
.shell{display:flex;min-height:100vh}

/* sidebar */
.sidebar{width:210px;flex-shrink:0;background:var(--ink);padding:22px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:10}
.logo{font-size:13px;font-weight:900;color:#fff;padding:2px 8px 14px;letter-spacing:.02em;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.logo span{color:var(--ink3);font-weight:600}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-weight:700;color:var(--ink3);border:none;background:none;transition:130ms;width:100%;text-align:left;font-family:'Nunito',sans-serif}
.nav-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-btn.active{background:#fff;color:var(--ink)}
.nav-divider{height:1px;background:rgba(255,255,255,.08);margin:6px 0}
.op-chip{margin-top:auto;padding:10px 12px;border-radius:var(--r-sm);font-size:11px;font-weight:700;line-height:1.9;white-space:pre-line}
.op-open{background:rgba(80,200,120,.15);color:#6de89a}
.op-rush{background:rgba(255,200,60,.12);color:#ffd060}
.op-closed{background:rgba(255,255,255,.05);color:var(--ink3)}

.main{flex:1;padding:26px 32px;overflow-y:auto;min-width:0}
.page{display:none}.page.active{display:block}

/* mobile nav */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--ink);border-top:1px solid rgba(255,255,255,.1);padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100;justify-content:space-around}
.mob-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 12px;cursor:pointer;border:none;background:none;font-family:'Nunito',sans-serif;font-size:10px;font-weight:700;color:var(--ink3);border-radius:var(--r-sm);transition:130ms}
.mob-btn.active{color:#fff}

/* page header */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.ph-title{font-size:20px;font-weight:900;letter-spacing:-.3px}
.ph-sub{font-size:11px;color:var(--ink3);font-weight:600;margin-top:2px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px}
.stat-l{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.stat-v{font-size:24px;font-weight:900;line-height:1}
.stat-h{font-size:11px;color:var(--ink4);font-weight:600;margin-top:2px}

/* weekly slots */
.weeks-wrap{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.weeks-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.weeks-head-title{font-size:12px;font-weight:800}
.weeks-nav{display:flex;align-items:center;gap:6px}
.wnav{font-size:11px;font-weight:700;color:var(--ink3)}
.wnav-btn{width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:100ms;font-family:'Nunito',sans-serif}
.wnav-btn:hover{background:var(--surface)}
.weeks-rows{display:flex;flex-direction:column;gap:7px}
.week-row{display:grid;grid-template-columns:90px 1fr 52px;align-items:center;gap:10px}
.wk-label{font-size:10px;font-weight:700;color:var(--ink2);line-height:1.5}
.wk-label em{font-style:normal;color:var(--ink4);font-weight:600;font-size:9px}
.wk-dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.wdot{width:10px;height:10px;border-radius:50%;border:2px solid var(--border);background:var(--bg);flex-shrink:0;transition:180ms}
.wdot.used{background:var(--ink);border-color:var(--ink)}
.wdot.rush{background:var(--ink2);border-color:var(--ink2)}
.wdot.over{background:var(--red);border-color:var(--red);animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.wk-count{font-size:11px;font-weight:800;text-align:right;white-space:nowrap}
.wk-count.full{color:var(--red)}.wk-count.warn{color:var(--ink2)}
.wk-full-tag{font-size:9px;font-weight:900;background:var(--red);color:#fff;padding:1px 6px;border-radius:20px;letter-spacing:.04em;margin-left:5px;display:none;flex-shrink:0}
.week-row.is-full .wk-full-tag{display:inline-flex}

/* filters */
.filters{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{padding:5px 13px;border-radius:20px;font-size:12px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;color:var(--ink2);font-weight:700;white-space:nowrap;transition:100ms;font-family:'Nunito',sans-serif}
.fbtn:hover{background:var(--surface)}
.fbtn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* cards — compact */
.cards-list{display:flex;flex-direction:column;gap:6px}
.card{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;transition:border-color 130ms,box-shadow 130ms}
.card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.card-name{font-size:13px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-client{font-size:10px;color:var(--ink3);font-weight:600;white-space:nowrap}
.badges{display:flex;gap:3px;flex-wrap:wrap;align-items:center;margin-bottom:5px}
.badge{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:800;border:1.5px solid;white-space:nowrap}
.b-ych,.b-serasa,.b-commission{background:#f2f2f0;color:#444;border-color:#d8d8d4}
.b-queued{background:var(--surface);color:var(--ink2);border-color:var(--border2)}
.b-wip{background:var(--ink);color:#fff;border-color:var(--ink)}
.b-done{background:#ececec;color:var(--ink3);border-color:#d8d8d8}
.b-rush{background:var(--ink);color:#fff;border-color:var(--ink)}
.b-normal{background:var(--surface);color:var(--ink2);border-color:var(--border2)}
.b-week{background:#f0eee8;color:var(--ink2);border-color:#d8d4cc}
.card-prog{margin:4px 0 3px}
.prog-label{display:flex;justify-content:space-between;font-size:9px;font-weight:700;color:var(--ink3);margin-bottom:3px}
.prog-track{height:4px;background:var(--surface);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width 500ms cubic-bezier(.4,0,.2,1)}
.pf-ok{background:var(--ink)}.pf-warn{background:var(--ink2)}.pf-hot{background:var(--red)}.pf-done{background:var(--ink3)}
.spill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;margin-bottom:4px;border:1.5px solid}
.spill-ok{background:#f4f4f0;color:var(--ink2);border-color:var(--border)}
.spill-warn{background:#f8f4ec;color:#7a5a00;border-color:#e8d498}
.spill-hot{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.spill-done{background:#f0f0ee;color:var(--ink3);border-color:var(--border)}
.card-meta{display:flex;gap:10px;font-size:10px;font-weight:600;color:var(--ink3);flex-wrap:wrap;margin-top:3px}
.card-actions{display:flex;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:var(--r-sm);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:120ms}
.btn-primary{background:var(--ink);color:#fff}.btn-primary:hover{opacity:.82}
.btn-outline{background:var(--white);color:var(--ink);border-color:var(--border2)}.btn-outline:hover{background:var(--surface)}
.btn-ghost{background:transparent;color:var(--ink2);border-color:var(--border)}.btn-ghost:hover{background:var(--surface)}
.btn-danger{background:transparent;color:var(--red);border-color:var(--red-bd)}.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:5px 10px;font-size:11px}

/* modal */
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:500;align-items:flex-end;justify-content:center}
.backdrop.open{display:flex}
.modal{background:var(--white);border-radius:var(--r) var(--r) 0 0;padding:20px 20px 32px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;animation:slideUp 220ms cubic-bezier(.34,1.1,.64,1)}
@keyframes slideUp{from{transform:translateY(32px);opacity:0}to{transform:none;opacity:1}}
.modal-handle{width:32px;height:4px;border-radius:99px;background:var(--border2);margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:900;margin-bottom:14px}
.fr{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fl{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em}
.fi{padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;background:var(--bg);color:var(--ink);outline:none;transition:100ms;-webkit-appearance:none;width:100%}
.fi:focus{border-color:var(--ink);background:var(--white)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* type / mode cards */
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.type-card{border:1.5px solid var(--border);border-radius:var(--r-sm);padding:10px 6px;text-align:center;cursor:pointer;transition:120ms;background:var(--bg)}
.type-card:hover{border-color:var(--border2)}
.type-card.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.tc-name{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 0}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mode-card{border:1.5px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;background:var(--bg);transition:120ms;font-family:'Nunito',sans-serif}
.mode-card:hover{border-color:var(--border2)}
.mode-card.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.mode-card.sel .mc-sub{color:var(--ink4)}
.mc-title{font-size:12px;font-weight:800;margin-bottom:2px}.mc-sub{font-size:10px;color:var(--ink3);font-weight:600}

/* tier picker */
.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}
.tier-card{border:1.5px solid var(--border);border-radius:var(--r-sm);padding:10px 6px;text-align:center;cursor:pointer;transition:120ms;background:var(--bg);font-family:'Nunito',sans-serif}
.tier-card:hover{border-color:var(--border2);background:var(--white)}
.tier-card.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.tier-card.sel .tier-sub{color:var(--ink4)}
.tier-lbl{font-size:16px;font-weight:900}
.tier-sub{font-size:9px;font-weight:700;color:var(--ink3);margin-top:3px;line-height:1.4}

/* rush info box */
.rush-box{border:1.5px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.rt-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:11px;font-weight:700;border-bottom:1px solid var(--border)}
.rt-row:last-child{border-bottom:none}
.rt-row.now{background:var(--ink);color:#fff}
.rt-elapsed{padding:7px 12px;font-size:10px;font-weight:700;color:var(--ink3);border-top:1px solid var(--border)}

/* week picker */
.week-grid{display:flex;gap:6px;flex-wrap:wrap}
.wk-pick{display:flex;flex-direction:column;align-items:center;padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;border:1.5px solid var(--border);background:var(--bg);font-family:'Nunito',sans-serif;transition:110ms;min-width:72px}
.wk-pick:hover{border-color:var(--border2);background:var(--white)}
.wk-pick.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.wk-pick.wk-full{border-color:var(--red-bd);background:var(--red-bg);color:var(--red)}
.wk-pick.wk-full.sel{background:var(--red);color:#fff;border-color:var(--red)}
.wp-num{font-size:12px;font-weight:900}
.wp-date{font-size:9px;font-weight:600;opacity:.7;margin-top:1px;text-align:center;line-height:1.3}
.wp-slot{font-size:9px;font-weight:800;margin-top:2px}
.wk-pick.sel .wp-slot,.wk-pick.wk-full.sel .wp-slot{opacity:.7}
.wk-pick.wk-full .wp-slot{color:var(--red)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}

/* calendar */
.cal-layout{display:grid;grid-template-columns:1fr 250px;gap:22px;align-items:start}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-month-lbl{font-size:17px;font-weight:900;flex:1}
.cal-nbtn{width:30px;height:30px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:100ms}
.cal-nbtn:hover{background:var(--surface)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dn{text-align:center;font-size:9px;font-weight:800;color:var(--ink4);text-transform:uppercase;padding:4px 0;letter-spacing:.04em}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:7px;font-size:11px;font-weight:600;cursor:default;border:1.5px solid transparent;position:relative}
.cal-day.faded{color:var(--ink4)}.cal-day.today{border-color:var(--ink);font-weight:900}
.cal-day.weekend{background:var(--surface);color:var(--ink3)}
.cal-day.has-dot::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--red);position:absolute;bottom:3px}
.dl-title{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.dl-list{display:flex;flex-direction:column;gap:6px}
.dl-item{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--white);border:1.5px solid var(--border);border-radius:var(--r-sm)}
.dl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dl-info{flex:1;min-width:0}
.dl-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-date{font-size:10px;color:var(--ink3);font-weight:600}
.dl-days{font-size:11px;font-weight:800;white-space:nowrap}

/* empty */
.empty{text-align:center;padding:44px 20px;color:var(--ink4)}
.empty-i{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.empty-t{font-size:12px;font-weight:700}

/* client view */
.client-wrap{min-height:100vh;background:var(--bg)}
.client-header{background:var(--ink);padding:13px 18px;display:flex;align-items:center;gap:12px}
.client-logo{font-size:14px;font-weight:900;color:#fff;letter-spacing:.02em}
.client-logo span{color:var(--ink3);font-weight:600}
.artist-btn{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink3);cursor:pointer;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-family:'Nunito',sans-serif;padding:5px 12px;border-radius:6px;transition:100ms;letter-spacing:.02em}
.artist-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.client-hero{text-align:center;padding:22px 20px 14px}
.client-hero h1{font-size:19px;font-weight:900;letter-spacing:-.3px;margin-bottom:4px}
.client-hero p{font-size:12px;color:var(--ink2);font-weight:500}
.client-search-wrap{max-width:360px;margin:0 auto 16px;padding:0 16px}
.client-search{width:100%;padding:10px 16px;border-radius:99px;border:2px solid var(--border2);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;background:var(--white);outline:none;transition:140ms;box-shadow:var(--shadow)}
.client-search:focus{border-color:var(--ink)}
.client-cards{padding:0 12px 80px;max-width:500px;margin:0 auto}

/* group header */
.cc-group{display:flex;align-items:center;gap:8px;margin:14px 0 7px}
.cc-group-label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.cc-group-count{font-size:10px;font-weight:800;background:var(--surface);color:var(--ink3);padding:1px 7px;border-radius:20px;border:1px solid var(--border)}
.cc-group-line{flex:1;height:1px;background:var(--border)}

/* compact client card */
.cc{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:7px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.cc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.cc-title{font-size:13px;font-weight:900;line-height:1.3}
.cc-client{font-size:10px;color:var(--ink3);font-weight:600}
.cc-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}

/* status chip — compact pill */
.cc-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:800;border:1.5px solid;margin-bottom:6px}
.cc-chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ccc-queued{background:var(--surface);color:var(--ink2);border-color:var(--border2)}
.ccc-wip{background:var(--ink);color:#fff;border-color:var(--ink)}
.ccc-done{background:#f0f0ec;color:var(--ink3);border-color:var(--border2)}
.ccc-hot{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.ccc-warn{background:#f8f4ec;color:#7a5a00;border-color:#e8d498}

/* estimate chip */
.cc-est{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;border:1.5px solid;margin-bottom:6px}
.cce-ok{background:#f0f8f2;color:#2a7a4a;border-color:#b8dfc8}
.cce-warn{background:#f8f4ec;color:#7a5a00;border-color:#e8d498}
.cce-hot{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.cce-done{background:#f0f0ec;color:var(--ink3);border-color:var(--border2)}
.cce-queue{background:var(--surface);color:var(--ink3);border-color:var(--border)}

.cc-prog-track{height:4px;background:var(--surface);border-radius:99px;overflow:hidden;margin-bottom:7px}
.cc-prog-fill{height:100%;border-radius:99px;transition:width 500ms cubic-bezier(.4,0,.2,1)}
.cc-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;font-weight:600;color:var(--ink3)}
.cc-note{margin-top:7px;padding:7px 10px;border-radius:7px;background:var(--surface);font-size:10px;font-weight:600;color:var(--ink2);border:1px solid var(--border)}

/* error text */
.err-msg{font-size:11px;color:var(--red);font-weight:700;margin:-4px 0 8px;display:none}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
@media(max-width:768px){
  .sidebar{display:none}.main{padding:16px 14px 80px}.mob-nav{display:flex}
  .stats{grid-template-columns:repeat(2,1fr)}.cal-layout{grid-template-columns:1fr}
  .cal-side{display:none}.fr2{grid-template-columns:1fr}.modal{max-width:100%}
  .week-grid{gap:5px}.wk-pick{min-width:64px;padding:6px 8px}
}
@media(min-width:769px){.mob-nav{display:none!important}}
</style>
</head>
<body>

<!-- ARTIST VIEW -->
<div class="view" id="view-artist">
<div class="shell">
<nav class="sidebar">
